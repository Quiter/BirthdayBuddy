# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# --- Build Performance ---
# JVM-Heap: 4 GB empfohlen für Compose + KSP + Hilt (Standard 2 GB ist knapp)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Module parallel bauen (sicher, da keine Cross-Project-Konfigurationsabhängigkeiten)
org.gradle.parallel=true
# Lokaler Build-Cache – vermeidet redundante Task-Ausführungen
org.gradle.caching=true
# Configuration-Cache – parsed build scripts nur einmal (kompatibel ab Hilt 2.48+, KSP 2.x)
org.gradle.configuration-cache=true
# Kotlin Incremental Compilation
kotlin.incremental=true

# --- Project Settings ---
kotlin.code.style=official
android.useAndroidX=true
android.newDsl=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
