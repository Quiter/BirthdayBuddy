name: Build and Release

on:
  push:
    paths:
      - 'app/build.gradle.kts'
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if versionName was modified
        id: version_check
        run: |
          if git diff HEAD~1 HEAD -- app/build.gradle.kts | grep -q 'versionName'; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        if: steps.version_check.outputs.version_changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: steps.version_check.outputs.version_changed == 'true'
        run: chmod +x gradlew

      - name: Run Unit Tests
        if: steps.version_check.outputs.version_changed == 'true'
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        if: steps.version_check.outputs.version_changed == 'true'
        run: ./gradlew assembleRelease

      - name: Sign and Rename APK
        if: steps.version_check.outputs.version_changed == 'true'
        id: sign_app
        run: |
          # 1. Den Schlüssel aus dem Secret wieder in eine Datei umwandeln
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.keystore
          
          # 2. Die unsignierte APK finden
          unsigned_apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          # 3. Mit apksigner signieren und direkt als BirthdayBuddy.apk ausgeben
          # Wir nutzen die Build-Tools Version, die auf dem Runner sicher da ist
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out BirthdayBuddy.apk "$unsigned_apk"
          
          echo "signed_apk=BirthdayBuddy.apk" >> $GITHUB_OUTPUT

      - name: Extract version
        if: steps.version_check.outputs.version_changed == 'true'
        id: extract_version
        run: |
          version=$(grep 'versionName' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        if: steps.version_check.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extract_version.outputs.version }}
          name: Release v${{ steps.extract_version.outputs.version }}
          files: BirthdayBuddy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
