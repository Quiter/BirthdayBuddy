name: Build on Version Change

on:
  push:
    paths:
      - 'app/build.gradle.kts'
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if versionName was modified
        id: version_check
        run: |
          if git diff HEAD~1 HEAD -- app/build.gradle.kts | grep -q 'versionName'; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 11
        if: steps.version_check.outputs.version_changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        if: steps.version_check.outputs.version_changed == 'true'
        run: chmod +x gradlew

      - name: Run Gradle build
        if: steps.version_check.outputs.version_changed == 'true'
        run: ./gradlew build

      - name: Extract version from build.gradle.kts
        if: steps.version_check.outputs.version_changed == 'true'
        id: extract_version
        run: |
          version=$(grep 'versionName' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Find APK file
        if: steps.version_check.outputs.version_changed == 'true'
        id: find_apk
        run: |
          apk_file=$(find app/build/outputs/apk -name '*.apk' -type f | head -n 1)
          if [ -z "$apk_file" ]; then
            echo "APK file not found!"
            exit 1
          fi
          echo "apk_path=$apk_file" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APK
        if: steps.version_check.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.extract_version.outputs.version }}
          name: Release v${{ steps.extract_version.outputs.version }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
