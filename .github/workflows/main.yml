name: Build and Release

on:
  push:
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version_check.outputs.version_changed }}
      version: ${{ steps.extract_version.outputs.version }}
      apk_name: ${{ steps.apk_name.outputs.apk_name }}
      tag_name: ${{ steps.apk_name.outputs.tag_name }}
      release_name: ${{ steps.apk_name.outputs.release_name }}
      prerelease: ${{ steps.apk_name.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if versionName was modified
        id: version_check
        run: |
          if git diff HEAD~1 HEAD -- app/build.gradle.kts | grep -q 'versionName'; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract version
        if: steps.version_check.outputs.version_changed == 'true'
        id: extract_version
        run: |
          version=$(grep 'versionName' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Determine APK Name and Tag
        if: steps.version_check.outputs.version_changed == 'true'
        id: apk_name
        run: |
          version="${{ steps.extract_version.outputs.version }}"
          branch="${{ github.ref_name }}"
          if [ "$branch" = "master" ]; then
            apk_name="BirthdayBuddy-${version}.apk"
            tag_name="v${version}"
            release_name="Release v${version}"
            prerelease="false"
          else
            # Ersetzt ungültige Zeichen im Branch-Namen durch Bindestriche
            safe_branch=$(echo "$branch" | sed 's/[^a-zA-Z0-9._-]/-/g')
            apk_name="BirthdayBuddy-${safe_branch}-${version}.apk"
            tag_name="v${version}-${safe_branch}"
            release_name="Release v${version} (${safe_branch})"
            prerelease="true"
          fi
          echo "apk_name=$apk_name" >> $GITHUB_OUTPUT
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          echo "release_name=$release_name" >> $GITHUB_OUTPUT
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT

  unit-tests:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

  build-apk:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1

  sign-and-release:
    runs-on: ubuntu-latest
    needs: [check-version, unit-tests, build-apk]
    if: needs.check-version.outputs.version_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: unsigned-apk
          path: unsigned-apk-dir

      - name: Sign and Rename APK
        id: sign_app
        run: |
          # 1. Den Schlüssel aus dem Secret wieder in eine Datei umwandeln
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.keystore
          
          # 2. Die unsignierte APK finden
          unsigned_apk=$(find unsigned-apk-dir -name "*.apk" | head -n 1)
          
          # 3. Den neuesten apksigner im Android SDK dynamisch finden (behebt Probleme mit verschiedenen Versionen)
          apksigner_path=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -r | head -n 1)
          if [ -z "$apksigner_path" ]; then
            echo "apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          
          # 4. Mit apksigner signieren und mit dem passenden Namen ausgeben
          $apksigner_path sign --ks release.keystore \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "${{ needs.check-version.outputs.apk_name }}" "$unsigned_apk"

      - name: Generate Changelog for Master Release
        id: generate_changelog
        run: |
          # Standardmäßig leere Datei erzeugen (für Nicht-Master-Branches / Prereleases)
          touch release_notes.md
          
          if [ "${{ github.ref_name }}" = "master" ]; then
            git fetch --tags --force
            CURRENT_TAG="${{ needs.check-version.outputs.tag_name }}"
            
            # Suche vorherigen stabilen Release-Tag auf master (Format vX.Y.Z, ignoriert -development Suffixe)
            PREV_TAG=""
            for tag in $(git tag --merged HEAD --sort=-creatordate | grep -E "^v[0-9]+\.[0-9]+(\.[0-9]+)?$"); do
              if [ "$tag" != "$CURRENT_TAG" ]; then
                count=$(git rev-list --count "${tag}..HEAD" 2>/dev/null || echo "0")
                if [ "$count" -gt 0 ]; then
                  PREV_TAG="$tag"
                  break
                fi
              fi
            done
            
            echo "Current Tag: $CURRENT_TAG"
            echo "Previous Tag: $PREV_TAG"
            
            {
              echo "## 🚀 What's Changed in ${CURRENT_TAG}"
              echo ""
              if [ -n "$PREV_TAG" ]; then
                RANGE="${PREV_TAG}..HEAD"
                
                FEAT=$(git log "$RANGE" --grep="^feat" --pretty=format:"* %s (%h)" --no-merges)
                FIX=$(git log "$RANGE" --grep="^fix" --pretty=format:"* %s (%h)" --no-merges)
                REFACTOR=$(git log "$RANGE" --grep="^refactor" --pretty=format:"* %s (%h)" --no-merges)
                PERF=$(git log "$RANGE" -E --grep="^perf|optimization" --pretty=format:"* %s (%h)" --no-merges)
                OTHER=$(git log "$RANGE" --invert-grep --grep="^feat" --grep="^fix" --grep="^refactor" --grep="^perf" -E --grep="optimization" --pretty=format:"* %s (%h)" --no-merges)
                
                if [ -n "$FEAT" ]; then
                  echo "### ✨ Features"
                  echo "$FEAT"
                  echo ""
                fi
                if [ -n "$FIX" ]; then
                  echo "### 🐛 Bug Fixes"
                  echo "$FIX"
                  echo ""
                fi
                if [ -n "$REFACTOR" ]; then
                  echo "### 🛠️ Architecture & Refactoring"
                  echo "$REFACTOR"
                  echo ""
                fi
                if [ -n "$PERF" ]; then
                  echo "### ⚡ Performance & Optimization"
                  echo "$PERF"
                  echo ""
                fi
                if [ -n "$OTHER" ]; then
                  echo "### 📝 Other Changes"
                  echo "$OTHER"
                  echo ""
                fi
                
                echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
              else
                echo "### 📝 Commits"
                git log -n 30 --pretty=format:"* %s (%h)" --no-merges
              fi
            } > release_notes.md
          fi

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          name: ${{ needs.check-version.outputs.release_name }}
          files: ${{ needs.check-version.outputs.apk_name }}
          prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
